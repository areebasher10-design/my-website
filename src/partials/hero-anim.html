<figure class="hero-figure" data-hero-anim>

                  <text x="44" y="424" class="ha-title">Campaign Pipeline</text>

                <li>Qualification fields noted</li>
                <li>Prospect entered in CRM</li>
                <li>Follow-up organized</li>
